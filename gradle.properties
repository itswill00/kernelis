# KERNELIS — build configuration tuned for low-RAM environments.
# Heap is capped so the Gradle daemon cannot grow unbounded on small machines.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Lower worker count: parallel workers each fork Kotlin compilers, which multiplies RAM use.
org.gradle.workers.max=2
org.gradle.parallel=false

# Caches speed up rebuilds without resident daemons.
org.gradle.caching=true

# Configuration cache holds project state in memory between builds; disabled on low-RAM hosts.
org.gradle.configuration-cache=false

# Exit the daemon after the build so RAM is returned to the OS immediately.
org.gradle.daemon.idletimeout=60000

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
